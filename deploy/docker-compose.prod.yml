services:
  db_kikiacademy:
    image: postgres:14
    container_name: postgres_db_kikiacademy
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - postgres_data_kikiacademy:/var/lib/postgresql/data
    networks: [portfolio_network_kikiacademy]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis_kikiacademy:
    image: redis:7-alpine
    container_name: redis_kikiacademy
    restart: unless-stopped
    networks: [portfolio_network_kikiacademy]

  web_kikiacademy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    container_name: django_web_kikiacademy
    restart: unless-stopped
    env_file: ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    depends_on:
      db_kikiacademy:
        condition: service_healthy
      redis_kikiacademy:
        condition: service_started
    volumes:
      # Bind-mount в host-папки, которые отдаёт внешний nginx
      # (/static/ -> ../staticfiles, /media/ -> ../media). Через named-volume
      # collectstatic и загрузки уходили мимо nginx и не отображались.
      - ../staticfiles:/app/staticfiles
      - ../media:/app/media
    ports:
      - "8086:8000"
    networks: [portfolio_network_kikiacademy]

volumes:
  postgres_data_kikiacademy:

networks:
  portfolio_network_kikiacademy:
    driver: bridge
